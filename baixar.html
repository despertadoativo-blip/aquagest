<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#087443" />
    <title>Baixar AquaGest Pro</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f8f4; color: #17352a; }
      main { width: min(92vw, 620px); padding: 32px; background: #fff; border: 1px solid #d8e8dc; border-radius: 24px; box-shadow: 0 18px 50px rgba(17, 75, 44, .12); }
      img { width: 76px; height: 76px; object-fit: contain; border-radius: 20px; margin-bottom: 12px; }
      h1 { margin: 0 0 8px; color: #087443; }
      p { line-height: 1.6; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 12px; background: #087443; color: #fff; text-decoration: none; font-weight: 700; }
      a.secondary { background: #e6f3e9; color: #087443; }
      small { display: block; margin-top: 20px; color: #5d7166; }
    </style>
  </head>
  <body>
    <main>
      <img src="icon-192.png" alt="Logo AquaGest Pro" />
      <h1>AquaGest Pro</h1>
      <p>Baixe a pasta completa com todos os arquivos auditados e abra no Acode ou em um servidor local.</p>
      <div class="actions">
        <a class="secondary" href="desktop.html">Abrir versão para computador</a>
        <a class="secondary" href="index.html">Abrir aplicativo</a>
      </div>
      <small>Para usar com dados reais, abra sempre o endereço oficial no Chrome. Pré-visualizações locais não guardam dados de forma duradoura.</small>
    </main>
  </body>
</html>
